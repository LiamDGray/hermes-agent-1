repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff enforcement (blocking)
        entry: .venv/bin/ruff check .
        language: system
        files: \.py$
        pass_filenames: false

      - id: windows-footguns
        name: Windows footguns (blocking)
        entry: .venv/bin/python scripts/check-windows-footguns.py --all
        language: system
        files: \.py$
        pass_filenames: false
        require_serial: true

      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        require_serial: true
